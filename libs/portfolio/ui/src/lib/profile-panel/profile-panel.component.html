<div class="profile-panel">
  <div class="profile-panel__top">
    <span
      class="profile-panel__border profile-panel__border--1"
      aria-hidden="true"
    ></span>
    <span
      class="profile-panel__border profile-panel__border--2"
      aria-hidden="true"
    ></span>

    <div class="profile-panel__media">
      <img
        class="profile-panel__avatar"
        data-testid="profile-avatar"
        [ngSrc]="profile().avatarUrl"
        [alt]="profile().name"
        fill
        priority
      />
    </div>

    <div class="profile-panel__intro">
      <p class="profile-panel__greeting">{{ profile().greeting }}</p>
      <h1 class="profile-panel__name" data-testid="profile-name">
        <span class="profile-panel__sr">{{ profile().name }}</span>
        <span
          class="profile-panel__typed"
          aria-hidden="true"
          [appTypingTitle]="profile().roles"
        ></span>
      </h1>
    </div>
  </div>

  <ul class="profile-panel__social">
    @for (link of profile().social; track link.url) {
      <li>
        <button
          type="button"
          class="profile-panel__social-link"
          (click)="openLink(link.url)"
          data-testid="social-link"
          [attr.aria-label]="link.label"
        >
          <app-icon
            class="profile-panel__social-link-icon"
            [name]="link.icon"
          />
        </button>
      </li>
    }
  </ul>

  @if (profile().available) {
    <button
      type="button"
      class="profile-panel__availability"
      (click)="openLink(profile().availabilityUrl)"
      data-testid="availability"
      aria-label="Available for hire!"
    >
      <span class="profile-panel__dot"></span>
      <span>Available for hire!</span>
    </button>
  }

  <button
    type="button"
    class="profile-panel__cv"
    (click)="downloadCv()"
    data-testid="cv-link"
    aria-label="Download CV"
  >
    <app-icon
      class="profile-panel__cv-icon"
      name="mdi-light--download"
    ></app-icon>
    <span class="profile-panel__cv-text">Download CV</span>
  </button>
</div>
