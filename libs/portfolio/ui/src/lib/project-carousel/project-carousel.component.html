<div
  class="carousel"
  data-testid="carousel"
  [attr.data-active-index]="index()"
  role="group"
  aria-roledescription="carousel"
  aria-label="Featured projects"
  tabindex="0"
  (pointerenter)="onPointerEnter($event)"
  (pointerleave)="onPointerLeave($event)"
  (focusin)="onFocusIn()"
  (keydown)="onKeydown($event)"
>
  <div class="carousel__nav">
    <button
      type="button"
      class="carousel__button"
      data-testid="carousel-prev"
      aria-label="Previous project"
      (click)="prev()"
    >
      <app-icon class="carousel__button-icon" name="mdi-light--arrow-left" />
    </button>
    <button
      type="button"
      class="carousel__button"
      data-testid="carousel-next"
      aria-label="Next project"
      (click)="next()"
    >
      <app-icon
        class="carousel__button-icon carousel__button-icon--next"
        name="mdi-light--arrow-left"
      />
    </button>
  </div>

  <div #viewport class="carousel__viewport" data-testid="carousel-viewport">
    <div
      class="carousel__track"
      [class.carousel__track--instant]="!animate()"
      [style.transform]="'translate3d(' + offset() + 'px, 0, 0)'"
      (transitionend)="onTransitionEnd($event)"
    >
      @for (slide of slides(); track slide.key) {
        <div
          class="carousel__slide"
          [class.carousel__slide--clone]="slide.clone"
          [attr.aria-hidden]="slide.clone ? 'true' : null"
        >
          <app-project-card
            [project]="slide.project"
            (opened)="onSelect($event)"
          />
        </div>
      }
    </div>
  </div>
</div>
