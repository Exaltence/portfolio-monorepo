<div
  #root
  class="carousel"
  data-testid="carousel"
  [attr.data-active-index]="index()"
  role="group"
  aria-roledescription="carousel"
  aria-label="Featured projects"
  [attr.aria-describedby]="helpId"
  tabindex="0"
  (pointerover)="onPointerActive($event)"
  (pointerleave)="onPointerLeave($event)"
  (keydown)="onKeydown($event)"
>
  <p class="u-sr-only" [id]="helpId">
    Use the left and right arrow keys to move between projects.
  </p>

  <div class="carousel__nav">
    @if (rotates()) {
      <button
        type="button"
        class="carousel__button"
        data-testid="carousel-rotation"
        [attr.aria-label]="
          userPaused()
            ? 'Resume automatic rotation'
            : 'Pause automatic rotation'
        "
        (click)="toggleRotation()"
      >
        <app-icon
          class="carousel__button-icon"
          [name]="userPaused() ? 'mdi-light--play' : 'mdi-light--pause'"
        />
      </button>
    }
    <button
      type="button"
      class="carousel__button"
      data-testid="carousel-prev"
      aria-label="Previous project"
      (click)="prev()"
    >
      <app-icon class="carousel__button-icon" name="mdi-light--arrow-left" />
    </button>
    <button
      type="button"
      class="carousel__button"
      data-testid="carousel-next"
      aria-label="Next project"
      (click)="next()"
    >
      <app-icon
        class="carousel__button-icon carousel__button-icon--next"
        name="mdi-light--arrow-left"
      />
    </button>
  </div>

  <div #viewport class="carousel__viewport" data-testid="carousel-viewport">
    <div
      class="carousel__track"
      [class.carousel__track--instant]="!animate()"
      [style.transform]="'translate3d(' + offset() + 'px, 0, 0)'"
      (transitionend)="onTransitionEnd($event)"
    >
      @for (slide of slides(); track slide.key; let i = $index) {
        <div
          class="carousel__slide"
          [class.carousel__slide--clone]="slide.clone"
          [attr.aria-hidden]="slide.clone ? 'true' : null"
          [attr.role]="slide.label ? 'group' : null"
          [attr.aria-roledescription]="slide.label ? 'slide' : null"
          [attr.aria-label]="slide.label"
        >
          <app-project-card
            [project]="slide.project"
            (opened)="onSelect($event, i)"
          />
        </div>
      }
    </div>
  </div>
</div>
