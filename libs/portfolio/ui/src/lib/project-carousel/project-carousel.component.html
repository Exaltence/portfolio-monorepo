<div
  class="carousel"
  data-testid="carousel"
  role="group"
  aria-roledescription="carousel"
  aria-label="Featured projects"
  tabindex="0"
  (mouseenter)="pause()"
  (mouseleave)="resume()"
  (focusin)="pause()"
  (focusout)="resume()"
  (keydown)="onKeydown($event)"
>
  <div class="carousel__nav">
    <button
      type="button"
      class="carousel__button"
      data-testid="carousel-prev"
      aria-label="Previous project"
      (click)="prev()"
    >
      <svg
        class="carousel__button-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
      >
        <path
          fill="currentColor"
          d="M19 13H6.75L12 18.25l-.66.75l-6.5-6.5l6.5-6.5l.66.75L6.75 12H19z"
        />
      </svg>
    </button>
    <button
      type="button"
      class="carousel__button"
      data-testid="carousel-next"
      aria-label="Next project"
      (click)="next()"
    >
      <svg
        class="carousel__button-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
      >
        <path
          fill="currentColor"
          d="M4 12h12.25L11 6.75l.66-.75l6.5 6.5l-6.5 6.5l-.66-.75L16.25 13H4z"
        />
      </svg>
    </button>
  </div>

  <div #viewport class="carousel__viewport">
    <div
      class="carousel__track"
      [style.transform]="'translateX(' + offset() + 'px)'"
    >
      @for (project of projects(); track project.id) {
        <div class="carousel__slide">
          <app-project-card [project]="project" (opened)="onSelect($event)" />
        </div>
      }
    </div>
  </div>
</div>
