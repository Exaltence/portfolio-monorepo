<div
  class="carousel"
  data-testid="carousel"
  [attr.data-active-index]="index()"
  role="group"
  aria-roledescription="carousel"
  aria-label="Featured projects"
  tabindex="0"
  (pointerenter)="onPointerEnter($event)"
  (pointerleave)="onPointerLeave($event)"
  (focusin)="onFocusIn()"
  (keydown)="onKeydown($event)"
>
  <div class="carousel__nav">
    <button
      type="button"
      class="carousel__button"
      data-testid="carousel-prev"
      aria-label="Previous project"
      (click)="prev()"
    >
      <svg
        class="carousel__button-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
      >
        <path
          fill="currentColor"
          d="M19 13H6.75L12 18.25l-.66.75l-6.5-6.5l6.5-6.5l.66.75L6.75 12H19z"
        />
      </svg>
    </button>
    <button
      type="button"
      class="carousel__button"
      data-testid="carousel-next"
      aria-label="Next project"
      (click)="next()"
    >
      <svg
        class="carousel__button-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
      >
        <path
          fill="currentColor"
          d="M4 12h12.25L11 6.75l.66-.75l6.5 6.5l-6.5 6.5l-.66-.75L16.25 13H4z"
        />
      </svg>
    </button>
  </div>

  <div
    #viewport
    class="carousel__viewport"
    [class.carousel__viewport--dragging]="dragging()"
    data-testid="carousel-viewport"
    (pointerdown)="onDragStart($event)"
    (pointermove)="onDragMove($event)"
    (pointerup)="onDragEnd()"
    (pointercancel)="onDragEnd()"
  >
    <div
      class="carousel__track"
      [class.carousel__track--instant]="!animate()"
      [style.transform]="'translate3d(' + offset() + 'px, 0, 0)'"
      (transitionend)="onTransitionEnd($event)"
    >
      @for (slide of slides(); track slide.key) {
        <div
          class="carousel__slide"
          [attr.inert]="slide.clone ? '' : null"
          [attr.aria-hidden]="slide.clone ? 'true' : null"
        >
          <app-project-card
            [project]="slide.project"
            (opened)="onSelect($event)"
          />
        </div>
      }
    </div>
  </div>
</div>
