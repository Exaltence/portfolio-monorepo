@if (store.about.hasValue()) {
  @let about = store.about.value();
  <section class="about-feature">
    <header>
      <p class="about-feature__subtitle">{{ about.subtitle }}</p>
      <h2 class="about-feature__title">{{ about.title }}</h2>
    </header>
    <p class="about-feature__intro" data-testid="about-intro">
      {{ about.intro }}
    </p>

    <app-tab-group [tabGroup]="tabGroup">
      <ng-template>
        <app-skill-list [skills]="about.skills" />
      </ng-template>
      <ng-template>
        <app-resume-list [entries]="about.experience" />
      </ng-template>
      <ng-template>
        <app-resume-list [entries]="about.education" />
      </ng-template>
      <ng-template>
        <app-resume-list [entries]="about.certificates" />
      </ng-template>
    </app-tab-group>
  </section>
} @else if (store.about.error()) {
  <p class="about-feature__error" role="alert" data-testid="about-error">
    Unable to load the about section.
  </p>
} @else {
  <p class="about-feature__loading" role="status" data-testid="about-loading">
    Loading…
  </p>
}
