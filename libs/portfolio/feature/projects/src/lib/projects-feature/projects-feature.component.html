@if (store.projects.hasValue()) {
  <section class="projects-feature">
    <header>
      <p class="projects-feature__subtitle">Portfolio</p>
      <h2 class="projects-feature__title">Featured Projects</h2>
    </header>
    <app-project-carousel
      [projects]="store.projects.value()"
      [paused]="modalOpen()"
      (selected)="open($event)"
    />
  </section>
} @else if (store.projects.error()) {
  <p class="projects-feature__error" role="alert" data-testid="projects-error">
    Unable to load the projects.
  </p>
} @else {
  <p
    class="projects-feature__loading"
    role="status"
    data-testid="projects-loading"
  >
    Loading…
  </p>
}
