@if (store.projects.hasValue()) {
  <app-project-carousel
    [projects]="store.projects.value()"
    (selected)="open($event)"
  />
} @else if (store.projects.error()) {
  <p class="projects-feature__error" data-testid="projects-error">
    Unable to load the projects.
  </p>
} @else {
  <p class="projects-feature__loading" data-testid="projects-loading">
    Loading…
  </p>
}
