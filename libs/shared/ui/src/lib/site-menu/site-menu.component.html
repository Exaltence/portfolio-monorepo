@if (open()) {
  <div class="site-menu">
    <button
      type="button"
      class="site-menu__overlay"
      data-testid="nav-overlay"
      aria-label="Close menu"
      animate.enter="site-menu-overlay-enter"
      animate.leave="site-menu-overlay-leave"
      (click)="close()"
    ></button>

    <nav
      class="site-menu__panel"
      aria-label="Primary"
      animate.enter="site-menu-panel-enter"
      animate.leave="site-menu-panel-leave"
    >
      <button
        type="button"
        class="site-menu__close"
        data-testid="nav-close"
        aria-label="Close"
        (click)="close()"
      >
        <app-icon class="site-menu__close-icon" name="mdi--close" />
      </button>
      <ul class="site-menu__list">
        @for (item of items(); track item.fragment; let i = $index) {
          <li class="site-menu__item">
            <button
              type="button"
              class="site-menu__link"
              data-testid="nav-item"
              animate.enter="site-menu-link-enter"
              [style.--stagger-index]="i"
              (click)="select(item)"
              [attr.aria-label]="'Navigate to ' + item.label"
            >
              <span class="site-menu__text">{{ item.label }}</span>
            </button>
          </li>
        }
      </ul>
    </nav>
  </div>
}
