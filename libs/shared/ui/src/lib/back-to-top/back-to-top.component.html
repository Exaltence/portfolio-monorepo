<button
  type="button"
  class="back-to-top"
  [class.is-visible]="visible()"
  data-testid="back-to-top"
  aria-label="Back to top"
  (click)="onClick()"
>
  <svg
    class="back-to-top__icon"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <path
      fill="currentColor"
      d="m12 8l-6 6l1.41 1.41L12 10.83l4.59 4.58L18 14z"
    />
  </svg>
</button>
