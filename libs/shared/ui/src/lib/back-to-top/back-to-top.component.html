<button
  type="button"
  class="back-to-top"
  [class.is-visible]="visible()"
  data-testid="back-to-top"
  aria-label="Back to top"
  (click)="onClick()"
>
  <svg
    class="back-to-top__icon"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <path
      fill="currentColor"
      d="M11 20V7.75L5.75 13L5 12.34l6.5-6.5l6.5 6.5l-.75.66L12 7.75V20z"
    />
  </svg>
</button>
