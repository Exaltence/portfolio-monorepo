<div class="home">
  <div
    class="home__sentinel"
    appScrollSpy
    (scrolled)="onScrolled($event)"
  ></div>

  <button
    type="button"
    class="home__menu-trigger"
    data-testid="menu-trigger"
    aria-label="Open menu"
    aria-haspopup="dialog"
    [attr.aria-expanded]="menuOpen()"
    animate.enter="u-enter-fade-slide u-enter-delay-1"
    (click)="menuOpen.set(true)"
  >
    <span class="home__menu-text">Menu</span>
    <app-icon class="home__menu-icon" name="mdi-light--menu" />
  </button>

  <app-site-menu
    [open]="menuOpen()"
    (openChange)="menuOpen.set($event)"
    [items]="navItems"
    (navigate)="navigate($event)"
  />

  <main class="home__main">
    <section id="home" class="home__section" tabindex="-1">
      <app-about-feature animate.enter="u-enter-fade-slide u-enter-delay-2" />
    </section>
    <section id="portfolio" class="home__section" tabindex="-1">
      <app-projects-feature
        animate.enter="u-enter-fade-slide u-enter-delay-3"
      />
    </section>
  </main>

  <aside class="home__aside">
    <app-profile-panel-feature
      animate.enter="u-enter-fade-slide u-enter-delay-4"
    />
  </aside>

  <footer
    class="home__footer"
    animate.enter="u-enter-fade-slide u-enter-delay-5"
  >
    <app-back-to-top class="home__back-to-top" [visible]="scrolled()" />
    <p>
      Coded in
      <a
        class="home__footer-link"
        data-testid="footer-link"
        href="https://code.visualstudio.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Visual Studio Code</span>
      </a>
      built with
      <a
        class="home__footer-link"
        data-testid="footer-link"
        href="https://nx.dev/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Nx</span>
      </a>
      and modern
      <a
        class="home__footer-link"
        data-testid="footer-link"
        href="https://angular.dev/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Angular</span>
      </a>
      deployed on
      <a
        class="home__footer-link"
        data-testid="footer-link"
        href="https://docs.github.com/en/pages"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>GitHub Pages</span>
      </a>
      using
      <a
        class="home__footer-link"
        data-testid="footer-link"
        href="https://github.com/features/actions"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>GitHub Actions</span>
      </a>
      for CI/CD.
      <br />
      Copyright &copy; {{ year }}. All rights reserved.
    </p>
  </footer>
</div>
