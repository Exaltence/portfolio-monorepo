<div class="home" [class.scrolled]="scrolled()">
  <div
    class="home__sentinel"
    appScrollSpy
    (scrolled)="onScrolled($event)"
  ></div>

  <button
    type="button"
    class="home__menu-trigger"
    data-testid="menu-trigger"
    aria-label="Open menu"
    (click)="menuOpen.set(true)"
  >
    <span class="home__menu-text">Menu</span>
    <span class="home__hamburger" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </span>
  </button>

  <app-site-menu
    [open]="menuOpen()"
    (openChange)="menuOpen.set($event)"
    [items]="navItems"
    (navigate)="navigate($event)"
  />

  <main class="home__main">
    <section id="home" class="home__section">
      <app-about-feature />
    </section>
    <section id="portfolio" class="home__section">
      <app-projects-feature />
    </section>
  </main>

  <aside class="home__aside">
    <app-profile-panel-feature />
  </aside>

  <app-back-to-top class="home__back-to-top" [visible]="scrolled()" />

  <footer class="home__footer">
    <p>
      Coded in
      <a
        class="home__footer-link"
        href="https://code.visualstudio.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Visual Studio Code
      </a>
      built with
      <a
        class="home__footer-link"
        href="https://nx.dev/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Nx
      </a>
      and modern
      <a
        class="home__footer-link"
        href="https://angular.dev/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Angular
      </a>
      deployed on
      <a
        class="home__footer-link"
        href="https://docs.github.com/en/pages"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub Pages
      </a>
      using
      <a
        class="home__footer-link"
        href="https://github.com/features/actions"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub Actions
      </a>
      for CI/CD.
      <br />
      Copyright &copy; {{ year }}. All rights reserved.
    </p>
  </footer>
</div>
