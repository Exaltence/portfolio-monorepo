name: PR CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Verify icon sprite is up to date
        run: npm exec nx run portfolio:icon-sprite:check

      - name: Lint
        run: npm exec -- nx run-many --target=lint

      - name: Stylelint
        run: npm exec -- nx run-many --target=stylelint

      - name: Unit tests
        run: npm exec -- nx run-many --target=test

      - name: Build
        run: npm exec -- nx run portfolio:build:production

      - name: E2E tests
        run: npm exec nx run portfolio-e2e:e2e
